name: GART GALLERY - CI/CD

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:

  build-and-test:
    name: Build y pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Instalar dependencias
        run: npm ci --prefix front

      - name: Construir aplicación
        run: npm --prefix front run build

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias backend
        run: pip install -r back/services/requirements.txt

      - name: Ejecutar pruebas backend
        run: python -m unittest discover -s back/tests -p "test_*.py"


  integration:
    name: Pruebas de integración
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            front/package-lock.json
            back/package-lock.json

      - name: Instalar dependencias frontend y backend
        run: |
          npm ci --prefix front
          npm ci --prefix back

      - name: Construir sitio
        run: npm --prefix front run build

      - name: Ejecutar pruebas de integración
        run: npm --prefix back run test:integration


  lighthouse:
    name: Verificación SEO y rutas publicadas
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: npm ci --prefix front

      - name: Construir aplicación
        run: npm --prefix front run build

      - name: Verificar metadatos y rutas estáticas
        run: node front/scripts/verify-seo.js

  deploy:
    name: Despliegue a producción
    needs: lighthouse
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Desplegar nueva versión
        run: echo "Desplegando GART GALLERY..."

      - name: Validar nueva versión
        run: echo "Validando aplicación desplegada..."

      - name: Activar nueva versión
        run: echo "Nueva versión de GART GALLERY activa"    
  
