services:
  - type: web
    name: gart-gallery-v2
    env: node
    plan: free
    buildCommand: cd front && npm ci --include=dev && npm run astro:build && cd ../back && npm ci
    startCommand: cd back && npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: GALLERY_SERVICE_URL
        value: https://gart-gallery-gallery-v2.onrender.com
      - key: WORKS_SERVICE_URL
        value: https://gart-gallery-works-v2.onrender.com
      - key: AUTH_SERVICE_URL
        value: https://gart-gallery-auth-v2.onrender.com
      - key: PURCHASE_SERVICE_URL
        value: https://gart-gallery-purchase-v2.onrender.com
      - key: CONTENT_SERVICE_URL
        value: https://gart-gallery-content-v2.onrender.com

  - type: web
    name: gart-gallery-gallery-v2
    env: python
    plan: free
    buildCommand: cd back && pip install -r services/requirements.txt
    startCommand: cd back && PYTHONPATH=services uvicorn --app-dir services/gallery-service app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gart-gallery-db-v2
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: gart-gallery-auth-v2
          property: hostport

  - type: web
    name: gart-gallery-works-v2
    env: python
    plan: free
    buildCommand: cd back && pip install -r services/requirements.txt
    startCommand: cd back && PYTHONPATH=services uvicorn --app-dir services/works-service app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gart-gallery-db-v2
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: gart-gallery-auth-v2
          property: hostport

  - type: web
    name: gart-gallery-auth-v2
    env: python
    plan: free
    buildCommand: cd back && pip install -r services/requirements.txt
    startCommand: cd back && PYTHONPATH=services uvicorn --app-dir services/auth-service app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gart-gallery-db-v2
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: TOKEN_PEPPER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: gart-gallery-purchase-v2
    env: python
    plan: free
    buildCommand: cd back && pip install -r services/requirements.txt
    startCommand: cd back && PYTHONPATH=services uvicorn --app-dir services/purchase-service app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gart-gallery-db-v2
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: gart-gallery-auth-v2
          property: hostport
      - key: WORKS_SERVICE_URL
        fromService:
          type: web
          name: gart-gallery-works-v2
          property: hostport
      - key: TOKEN_PEPPER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: gart-gallery-content-v2
    env: python
    plan: free
    buildCommand: cd back && pip install -r services/requirements.txt
    startCommand: cd back && PYTHONPATH=services uvicorn --app-dir services/content-service app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gart-gallery-db-v2
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: gart-gallery-auth-v2
          property: hostport

databases:
  - name: gart-gallery-db-v2
    plan: free
