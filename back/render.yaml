services:
  - type: web
    name: gart-gallery
    env: node
    plan: free
    buildCommand: cd front && npm ci --include=dev && npm run astro:build && cd ../back && npm ci
    startCommand: cd back && npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: GALLERY_SERVICE_URL
        fromService:
          type: web
          name: gart-gallery-gallery
          property: hostport
      - key: WORKS_SERVICE_URL
        fromService:
          type: web
          name: gart-gallery-works
          property: hostport
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: gart-gallery-auth
          property: hostport
      - key: PURCHASE_SERVICE_URL
        fromService:
          type: web
          name: gart-gallery-purchase
          property: hostport
      - key: CONTENT_SERVICE_URL
        fromService:
          type: web
          name: gart-gallery-content
          property: hostport

  - type: web
    name: gart-gallery-gallery
    env: python
    plan: free
    buildCommand: cd back && pip install -r services/requirements.txt
    startCommand: cd back && PYTHONPATH=services uvicorn --app-dir services/gallery-service app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gart-gallery-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: gart-gallery-auth
          property: hostport

  - type: web
    name: gart-gallery-works
    env: python
    plan: free
    buildCommand: cd back && pip install -r services/requirements.txt
    startCommand: cd back && PYTHONPATH=services uvicorn --app-dir services/works-service app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gart-gallery-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: gart-gallery-auth
          property: hostport

  - type: web
    name: gart-gallery-auth
    env: python
    plan: free
    buildCommand: cd back && pip install -r services/requirements.txt
    startCommand: cd back && PYTHONPATH=services uvicorn --app-dir services/auth-service app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gart-gallery-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: TOKEN_PEPPER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: gart-gallery-purchase
    env: python
    plan: free
    buildCommand: cd back && pip install -r services/requirements.txt
    startCommand: cd back && PYTHONPATH=services uvicorn --app-dir services/purchase-service app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gart-gallery-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: gart-gallery-auth
          property: hostport
      - key: WORKS_SERVICE_URL
        fromService:
          type: web
          name: gart-gallery-works
          property: hostport
      - key: TOKEN_PEPPER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: gart-gallery-content
    env: python
    plan: free
    buildCommand: cd back && pip install -r services/requirements.txt
    startCommand: cd back && PYTHONPATH=services uvicorn --app-dir services/content-service app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gart-gallery-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: gart-gallery-auth
          property: hostport

databases:
  - name: gart-gallery-db
    plan: free
